# Blueprint Render — L-ARTIS
# Dashboard : New → Blueprint → repo marcrosaire2-hue/L-ARTIS
# URLs actuelles :
#   API    https://lartis-api-sc17.onrender.com
#   Client https://lartis-client-fx8k.onrender.com
#   Admin  https://lartis-admin-jmii.onrender.com
services:
  # --- API Node.js -----------------------------------------------------------
  - type: web
    name: lartis-api-sc17
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: COOKIE_SECURE
        value: "true"
      - key: CLIENT_URL
        value: https://lartis-client-fx8k.onrender.com
      - key: ADMIN_URL
        value: https://lartis-admin-jmii.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: JWT_ISSUER
        value: artisans-marketplace-api
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "L-ARTIS <marcrosaire2@gmail.com>"
      - key: MAX_FILE_SIZE_MB
        value: "5"

  # --- Site client (SPA Vite) ------------------------------------------------
  - type: web
    name: lartis-client-fx8k
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://lartis-api-sc17.onrender.com/api/v1

  # --- Panneau admin (SPA Vite) ----------------------------------------------
  - type: web
    name: lartis-admin-jmii
    runtime: static
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://lartis-api-sc17.onrender.com/api/v1
